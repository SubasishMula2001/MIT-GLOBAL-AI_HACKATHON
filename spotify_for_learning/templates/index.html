<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify for Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Spotify for Learning</h1>
        <p>Generate your personalized 5-minute learning snippets on the go!</p>

        <form method="POST">
            <label>Enter Topics (comma-separated):</label><br>
            <input type="text" name="topics" required><br><br>

            <label>Enter Time Limit (minutes):</label><br>
            <input type="number" name="time_limit" value="5" min="1" max="10" required><br><br>

            <button type="submit">Generate Learning Snippet</button>
        </form>

        {% if display_text %}
        <div class="result">
            <p>{{ display_text }}</p>
            {% if audio_file %}
                <!-- Ensure the file path is correctly passed -->
                <audio controls>
                    <source src="{{ url_for('static', filename='audio/' + audio_file) }}" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            {% endif %}
        </div>
        {% endif %}

        <footer>
            <p>&copy; Developed by ❤️ India</p>
        </footer>
    </div>
</body>
</html>
